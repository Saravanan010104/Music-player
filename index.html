<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://kit.fontawesome.com/d82f17d74b.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="music-player">
    <h1>Music Player</h1>
    <input type="text" id="search" placeholder="Search song by name...">
    <div class="playlist-container">
      <ul id="playlist">
      <!-- Songs will be dynamically added here -->
      </ul>
    </div>
    <span id="current-time" style="font-size: 0.8em;">0:00</span>
    <input type="range" class="seek1" id="seek-bar" value="0" min="0" step="1" style="width: 70%; height: 10px;">
    <span id="duration" style="font-size: 0.8em;">0:00</span>
    <div class="controls">
      <button id="prev"><i class="fas fa-backward"></i></button>
      <button id="play"><i class="fa-solid fa-play"></i></button>
      <button id="next"><i class="fas fa-forward"></i></button>
    </div>
    
    <audio id="audio" controls style="display: none;"></audio>
  </div>
  <script src="script.js"></script>
</body>
</html>
